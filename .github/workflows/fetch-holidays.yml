name: Fetch MCX Market Holidays

on:
  schedule:
    # Every Sunday at 6 AM IST (00:30 UTC) — refresh before the trading week
    - cron: '30 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-holidays:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Fetch MCX/NSE holiday list
        run: node scripts/fetch-holidays.js

      - name: Commit updated holidays
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market-holidays.json
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore: refresh MCX market holidays [skip ci]"
          git push
