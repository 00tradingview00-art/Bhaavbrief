name: BhaavBrief Daily MCX Open Brief

on:
  schedule:
    # 9:00 AM IST = 3:30 AM UTC, Mon–Fri
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

concurrency:
  group: daily-open-brief
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  open-brief:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch market snapshot
        env:
          KITE_API_KEY:      ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: node scripts/fetch-snapshot.mjs

      - name: Generate Daily Open Brief
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KITE_API_KEY:      ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: |
          OUTPUT=$(node scripts/daily-open-brief.js 2>&1)
          echo "$OUTPUT"
          BRIEF_FILE=$(echo "$OUTPUT" | grep '^BRIEF_FILE=' | cut -d= -f2-)
          echo "brief_file=${BRIEF_FILE}" >> $GITHUB_OUTPUT

      - name: Validate brief (publish gate)
        id: validate
        if: steps.generate.outputs.brief_file != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f "${{ steps.generate.outputs.brief_file }}" ]; then
            node scripts/validate-brief.mjs data/market-snapshot.json "${{ steps.generate.outputs.brief_file }}"
          else
            echo "Brief file not found — skipping validation"
          fi

      - name: Commit & push
        id: commit
        run: |
          git config user.name "BhaavBrief Intelligence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/market-snapshot.json /tmp/bb-snapshot.json 2>/dev/null || true
          git add -A
          git checkout HEAD -- data/market-snapshot.json 2>/dev/null || true
          git stash
          git pull --rebase origin main
          git stash pop || true
          cp /tmp/bb-snapshot.json data/market-snapshot.json 2>/dev/null || true
          # Stage brief + snapshot atomically — site and email always agree on prices
          git add content/briefs/ content/articles/ data/daily-brief-state.json data/market-snapshot.json data/thesis-tracker.json
          if git diff --staged --quiet; then
            echo "No new brief"
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          DATE_IST=$(TZ=Asia/Kolkata date '+%a %d %b %Y')
          git commit -m "📊 MCX Open Brief — ${DATE_IST}"
          git push origin main
          echo "published=true" >> $GITHUB_OUTPUT

      - name: Wait for Vercel then send newsletter
        if: steps.commit.outputs.published == 'true' && steps.generate.outputs.brief_file != ''
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          SENDER_EMAIL:  ${{ secrets.SENDER_EMAIL }}
          BRIEF_FILE:    ${{ steps.generate.outputs.brief_file }}
        run: |
          if [ ! -f "$BRIEF_FILE" ]; then
            echo "Brief file not found: $BRIEF_FILE — skipping newsletter"
            exit 0
          fi
          echo "Waiting 3 minutes for Vercel to deploy..."
          sleep 180
          node scripts/send-newsletter.js

      - name: Alert on failure
        if: failure() && steps.validate.outcome != 'failure'
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "sender": { "name": "BhaavBrief Bot", "email": "${{ secrets.SENDER_EMAIL }}" },
              "to": [{ "email": "00tradingview00@gmail.com" }],
              "subject": "ACTION REQUIRED: MCX Open Brief pipeline failed — '"$(TZ=Asia/Kolkata date +'%d %b %Y')"'",
              "htmlContent": "<p>The <strong>Daily MCX Open Brief</strong> workflow failed on <strong>'"$(TZ=Asia/Kolkata date +'%d %b %Y, %I:%M %p IST')"'</strong>.</p><p>The MCX open brief may not have been published. Trigger the workflow manually if needed.</p><p><a href=\"https://github.com/${{ github.repository }}/actions/workflows/daily-open-brief.yml\">Re-run workflow →</a></p>"
            }'

  post-instagram:
    needs: open-brief
    if: needs.open-brief.result == 'success'
    uses: ./.github/workflows/post-instagram.yml
    secrets: inherit
