name: BhaavBrief Daily MCX Open Brief

on:
  schedule:
    # 9:00 AM IST = 3:30 AM UTC, Mon–Fri
    - cron: '30 3 * * 1-5'
  workflow_dispatch:  # Manual trigger for testing

permissions:
  contents: write

jobs:
  open-brief:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Daily Open Brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KITE_API_KEY:      ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: node scripts/daily-open-brief.js

      - name: Commit & push
        run: |
          git config user.name "BhaavBrief Intelligence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add content/articles/ data/daily-brief-state.json
          git diff --staged --quiet && echo "No new brief" && exit 0
          DATE_IST=$(TZ=Asia/Kolkata date '+%a %d %b %Y')
          git commit -m "📊 MCX Open Brief — ${DATE_IST}"
          git push origin main
