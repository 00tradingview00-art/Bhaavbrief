name: BhaavBrief Watchdog

on:
  schedule:
    # 9:45 AM IST = 4:15 AM UTC, Mon–Fri
    # Checks that morning brief published on time
    - cron: '15 4 * * 1-5'
    # 2:00 PM IST = 8:30 AM UTC, Mon–Fri
    # Checks that intelligence engine is active mid-session
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # FIX: always fetch the current HEAD of main, not the trigger-time SHA.
          # GitHub Actions locks GITHUB_SHA when the scheduled trigger fires, but
          # the actual runner may start 30–90 min later. Without ref: main, the
          # checkout uses the stale SHA and won't see content committed by
          # generate-brief between trigger time and execution time — causing false
          # "brief missing" alerts even when the brief is live on the site.
          ref: main

      - name: Check morning brief (9:45 AM IST run only)
        id: brief_check
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          if [ -n "$SCHEDULE" ] && [ "$SCHEDULE" != "15 4 * * 1-5" ]; then
            echo "Not the 9:45 AM run — skipping brief check"
            echo "brief_ok=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)

          # MCX holiday guard: generate-brief.js skips generation outright on
          # a market holiday (see scripts/generate-brief.js "MCX holiday
          # today ... skipping brief generation"), so an absent brief on a
          # holiday is correct behavior, not a failure. Same holiday source
          # the iv_check step below already uses.
          IS_HOLIDAY=$(jq --arg d "$TODAY" \
            '[.[] | select(.date == $d)] | length' \
            data/market-holidays.json 2>/dev/null || echo "0")
          IS_HOLIDAY="${IS_HOLIDAY:-0}"
          if [ "$IS_HOLIDAY" != "0" ]; then
            echo "MCX holiday today ($TODAY) — skipping brief check"
            echo "brief_ok=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Checking for brief dated $TODAY..."
          # Brief frontmatter stores an ISO timestamp: date: "2026-08-13T04:27:40.394Z"
          # Grep for the date prefix (no closing quote) to match ISO timestamps.
          FOUND=$(grep -rl "date: \"${TODAY}" content/briefs/ 2>/dev/null | head -1)
          if [ -z "$FOUND" ]; then
            echo "brief_ok=false" >> $GITHUB_OUTPUT
            echo "brief_date=$TODAY" >> $GITHUB_OUTPUT
            echo "::error::Morning brief NOT published for $TODAY"
          else
            echo "brief_ok=true" >> $GITHUB_OUTPUT
            echo "✓ Morning brief found: $FOUND"
          fi

      - name: Check intelligence engine (2:00 PM IST run only)
        id: engine_check
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          if [ -n "$SCHEDULE" ] && [ "$SCHEDULE" != "30 8 * * 1-5" ]; then
            echo "Not the 2:00 PM run — skipping engine check"
            echo "engine_ok=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)

          # MCX holiday guard: intelligence-engine.js sleeps outright on a
          # market holiday (see scripts/intelligence-engine.js "MCX holiday
          # ... engine sleeping"), so zero articles on a holiday is correct
          # behavior, not a failure. Same holiday source as iv_check below.
          IS_HOLIDAY=$(jq --arg d "$TODAY" \
            '[.[] | select(.date == $d)] | length' \
            data/market-holidays.json 2>/dev/null || echo "0")
          IS_HOLIDAY="${IS_HOLIDAY:-0}"
          if [ "$IS_HOLIDAY" != "0" ]; then
            echo "MCX holiday today ($TODAY) — skipping engine check"
            echo "engine_ok=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Checking for intelligence articles dated $TODAY..."
          # Same ISO-timestamp prefix match as brief check
          FOUND=$(grep -rl "date: \"${TODAY}" content/articles/ 2>/dev/null | head -1)
          if [ -z "$FOUND" ]; then
            echo "engine_ok=false" >> $GITHUB_OUTPUT
            echo "engine_date=$TODAY" >> $GITHUB_OUTPUT
            echo "::error::Intelligence engine has NOT published any articles for $TODAY by 2:00 PM IST"
          else
            COUNT=$(grep -rl "date: \"${TODAY}" content/articles/ 2>/dev/null | wc -l | tr -d ' ')
            echo "engine_ok=true" >> $GITHUB_OUTPUT
            echo "✓ Engine articles today: $COUNT"
          fi

      - name: Check ATM IV snapshot (9:45 AM IST run only)
        id: iv_check
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          if [ -n "$SCHEDULE" ] && [ "$SCHEDULE" != "15 4 * * 1-5" ]; then
            echo "Not the 9:45 AM run — skipping IV snapshot check"
            echo "iv_ok=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHECK_DATE=$(TZ=Asia/Kolkata date -d 'yesterday' +%Y-%m-%d)
          for i in 1 2 3 4 5; do
            DOW=$(date -d "$CHECK_DATE" +%u)
            # Suppress jq errors and default to 0 if market-holidays.json is missing
            IS_HOLIDAY=$(jq --arg d "$CHECK_DATE" \
              '[.[] | select(.date == $d)] | length' \
              data/market-holidays.json 2>/dev/null || echo "0")
            IS_HOLIDAY="${IS_HOLIDAY:-0}"
            if [ "$DOW" -ge 6 ] || [ "$IS_HOLIDAY" != "0" ]; then
              CHECK_DATE=$(date -d "$CHECK_DATE - 1 day" +%Y-%m-%d)
            else
              break
            fi
          done
          echo "Target date: $CHECK_DATE (last trading day)"

          # ── Bootstrap guard ────────────────────────────────────────────────────
          # If the iv-snapshot Vercel cron has never written any data to Redis,
          # ALL date checks will fail — this is a setup issue, not a monitoring
          # alert. Warn and skip rather than hard-fail on first-run or
          # misconfigured CRON_SECRET.
          GOLD_RESP=$(curl -s --max-time 10 \
            "https://bhaavbrief.in/api/options/iv-history?instrument=GOLD" || echo "")
          GOLD_TOTAL=$(echo "$GOLD_RESP" \
            | jq '.history | length' 2>/dev/null || echo "")
          if [ -z "$GOLD_TOTAL" ] || [ "$GOLD_TOTAL" = "0" ]; then
            echo "::warning::IV history is empty for GOLD — iv-snapshot Vercel cron may not" \
                 "be active yet, or CRON_SECRET is not set in Vercel env vars." \
                 "Skipping IV date check to avoid false alarms."
            echo "iv_ok=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "IV history has ${GOLD_TOTAL} total entries for GOLD — proceeding with date check"
          # ── End bootstrap guard ────────────────────────────────────────────────

          MISSING=""
          for INSTRUMENT in GOLD SILVER CRUDEOIL NATURALGAS COPPER; do
            RESPONSE=$(curl -s --max-time 10 \
              "https://bhaavbrief.in/api/options/iv-history?instrument=$INSTRUMENT" || echo "")
            COUNT=$(echo "$RESPONSE" \
              | jq --arg d "$CHECK_DATE" \
                '[.history[]? | select(.date == $d)] | length' 2>/dev/null || echo "")
            COUNT="${COUNT:-0}"
            if [ "$COUNT" = "0" ]; then
              MISSING="$MISSING $INSTRUMENT"
              # Show the most recent dates stored so we can distinguish
              # "never populated" from "yesterday specifically missing"
              LATEST=$(echo "$RESPONSE" \
                | jq -r '[.history[-3:][]?.date] | join(", ")' 2>/dev/null \
                || echo "unable to parse")
              echo "  ✗ $INSTRUMENT — no entry for $CHECK_DATE (most recent dates: ${LATEST:-none})"
            else
              echo "  ✓ $INSTRUMENT — IV snapshot present for $CHECK_DATE"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "iv_ok=false" >> $GITHUB_OUTPUT
            echo "iv_missing=$MISSING" >> $GITHUB_OUTPUT
            echo "iv_date=$CHECK_DATE" >> $GITHUB_OUTPUT
            echo "::error::ATM IV snapshot missing for $CHECK_DATE:$MISSING"
          else
            echo "iv_ok=true" >> $GITHUB_OUTPUT
            echo "✓ ATM IV snapshot present for all instruments on $CHECK_DATE"
          fi

      - name: Check OI-buildup snapshot (9:45 AM IST run only)
        id: oi_check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          if [ -n "$SCHEDULE" ] && [ "$SCHEDULE" != "15 4 * * 1-5" ]; then
            echo "Not the 9:45 AM run — skipping OI snapshot check"
            echo "oi_ok=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHECK_DATE=$(TZ=Asia/Kolkata date -d 'yesterday' +%Y-%m-%d)
          for i in 1 2 3 4 5; do
            DOW=$(date -d "$CHECK_DATE" +%u)
            IS_HOLIDAY=$(jq --arg d "$CHECK_DATE" \
              '[.[] | select(.date == $d)] | length' \
              data/market-holidays.json 2>/dev/null || echo "0")
            IS_HOLIDAY="${IS_HOLIDAY:-0}"
            if [ "$DOW" -ge 6 ] || [ "$IS_HOLIDAY" != "0" ]; then
              CHECK_DATE=$(date -d "$CHECK_DATE - 1 day" +%Y-%m-%d)
            else
              break
            fi
          done
          echo "Target date: $CHECK_DATE (last trading day)"

          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET not set as a GitHub Actions secret — cannot check OI-snapshot (it's Pro-gated). Skipping to avoid false alarms."
            echo "oi_ok=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ── Bootstrap guard ── same reasoning as the IV check above: if the
          # cron has never run, every date will show missing — that's a setup
          # gap, not a monitoring alert.
          GOLD_RESP=$(curl -s --max-time 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://bhaavbrief.in/api/options/oi-history?instrument=GOLD&date=${CHECK_DATE}" || echo "")
          GOLD_EXISTS=$(echo "$GOLD_RESP" | jq -r '.exists // empty' 2>/dev/null || echo "")
          if [ -z "$GOLD_EXISTS" ]; then
            echo "::warning::Could not reach oi-history (bad CRON_SECRET or route error) — skipping OI check."
            echo "oi_ok=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          MISSING=""
          for INSTRUMENT in GOLD SILVER CRUDEOIL NATURALGAS COPPER; do
            RESPONSE=$(curl -s --max-time 10 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://bhaavbrief.in/api/options/oi-history?instrument=$INSTRUMENT&date=${CHECK_DATE}" || echo "")
            EXISTS=$(echo "$RESPONSE" | jq -r '.exists // false' 2>/dev/null || echo "false")
            if [ "$EXISTS" != "true" ]; then
              MISSING="$MISSING $INSTRUMENT"
              echo "  ✗ $INSTRUMENT — no OI snapshot for $CHECK_DATE"
            else
              echo "  ✓ $INSTRUMENT — OI snapshot present for $CHECK_DATE"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "oi_ok=false" >> $GITHUB_OUTPUT
            echo "oi_missing=$MISSING" >> $GITHUB_OUTPUT
            echo "oi_date=$CHECK_DATE" >> $GITHUB_OUTPUT
            echo "::error::OI-buildup snapshot missing for $CHECK_DATE:$MISSING"
          else
            echo "oi_ok=true" >> $GITHUB_OUTPUT
            echo "✓ OI-buildup snapshot present for all instruments on $CHECK_DATE"
          fi

      - name: Check Kite daily login (9:45 AM IST run only)
        id: kite_check
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          if [ -n "$SCHEDULE" ] && [ "$SCHEDULE" != "15 4 * * 1-5" ]; then
            echo "Not the 9:45 AM run — skipping Kite login check"
            echo "kite_ok=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)

          # MCX holiday guard — same source as the brief/engine checks above.
          # No trading today means no one needs to have logged in.
          IS_HOLIDAY=$(jq --arg d "$TODAY" \
            '[.[] | select(.date == $d)] | length' \
            data/market-holidays.json 2>/dev/null || echo "0")
          IS_HOLIDAY="${IS_HOLIDAY:-0}"
          if [ "$IS_HOLIDAY" != "0" ]; then
            echo "MCX holiday today ($TODAY) — skipping Kite login check"
            echo "kite_ok=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_AUTH=$(jq -r '.lastAuth // ""' data/last-kite-auth.json 2>/dev/null || echo "")
          if [ "$LAST_AUTH" = "$TODAY" ]; then
            echo "kite_ok=true" >> $GITHUB_OUTPUT
            echo "✓ Kite login done today ($TODAY)"
          else
            echo "kite_ok=false" >> $GITHUB_OUTPUT
            echo "kite_last_auth=${LAST_AUTH:-never}" >> $GITHUB_OUTPUT
            echo "::error::Kite login not done today ($TODAY) — data/last-kite-auth.json shows lastAuth=${LAST_AUTH:-never}"
          fi

      - name: Check Basis daily snapshot (9:45 AM IST run only)
        id: basis_check
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          if [ -n "$SCHEDULE" ] && [ "$SCHEDULE" != "15 4 * * 1-5" ]; then
            echo "Not the 9:45 AM run — skipping Basis snapshot check"
            echo "basis_ok=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # fetch-snapshot.mjs (which writes data/history/{date}.json, the
          # source for the Basis Dashboard's 30-day chart) doesn't filter
          # holidays itself — it still runs and writes a (likely
          # stale-flagged) file. So unlike the other checks above, don't
          # skip on a holiday here: a missing file is still worth knowing
          # about, since the writing script doesn't skip either.
          CHECK_DATE=$(TZ=Asia/Kolkata date -d 'yesterday' +%Y-%m-%d)
          for i in 1 2 3 4 5; do
            DOW=$(date -d "$CHECK_DATE" +%u)
            if [ "$DOW" -ge 6 ]; then
              CHECK_DATE=$(date -d "$CHECK_DATE - 1 day" +%Y-%m-%d)
            else
              break
            fi
          done
          echo "Target date: $CHECK_DATE (last weekday)"

          if [ -f "data/history/${CHECK_DATE}.json" ]; then
            echo "basis_ok=true" >> $GITHUB_OUTPUT
            echo "✓ Basis snapshot present for $CHECK_DATE"
          else
            echo "basis_ok=false" >> $GITHUB_OUTPUT
            echo "basis_date=$CHECK_DATE" >> $GITHUB_OUTPUT
            echo "::error::Basis snapshot missing for $CHECK_DATE — data/history/${CHECK_DATE}.json not found"
          fi

      - name: Auto-recover — trigger generate-brief
        if: steps.brief_check.outputs.brief_ok == 'false'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/generate-brief.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Auto-triggered generate-brief at $(TZ=Asia/Kolkata date +'%I:%M %p IST')"

      - name: Notify — brief auto-recovered
        if: steps.brief_check.outputs.brief_ok == 'false'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          DATE_LABEL=$(TZ=Asia/Kolkata date +'%d %b %Y')
          RUN_URL="https://github.com/${{ github.repository }}/actions/workflows/generate-brief.yml"
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${BREVO_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"sender\": { \"name\": \"BhaavBrief Watchdog\", \"email\": \"${SENDER_EMAIL}\" },
              \"to\": [{ \"email\": \"00tradingview00@gmail.com\" }],
              \"subject\": \"Brief missing at 9:30 AM — auto-triggered at 9:45 AM | ${DATE_LABEL}\",
              \"htmlContent\": \"<p>The morning brief was not found by 9:45 AM IST on <strong>${DATE_LABEL}</strong>.</p><p><strong>Auto-recovery triggered.</strong> generate-brief has been dispatched and should publish within 5–10 minutes. No action needed unless this email is followed by a failure alert.</p><p><a href='${RUN_URL}'>Monitor workflow →</a></p>\"
            }"
          echo "Recovery notification sent"

      - name: Alert — engine silent
        if: steps.engine_check.outputs.engine_ok == 'false'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          DATE_LABEL=$(TZ=Asia/Kolkata date +'%d %b %Y')
          RUN_URL="https://github.com/${{ github.repository }}/actions/workflows/intelligence-engine.yml"
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${BREVO_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"sender\": { \"name\": \"BhaavBrief Watchdog\", \"email\": \"${SENDER_EMAIL}\" },
              \"to\": [{ \"email\": \"00tradingview00@gmail.com\" }],
              \"subject\": \"⚠️ Intelligence engine silent — ${DATE_LABEL}\",
              \"htmlContent\": \"<p>No intelligence articles found for <strong>${DATE_LABEL}</strong> by 2:00 PM IST.</p><p>The engine has been running since 9:00 AM but published nothing — possible Kite auth failure, Claude API error, or price threshold not triggered.</p><p><a href='${RUN_URL}'>Check engine workflow →</a></p>\"
            }"
          echo "Alert sent for silent engine"
          exit 1

      - name: Alert — Kite login not done today
        if: steps.kite_check.outputs.kite_ok == 'false'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          DATE_LABEL=$(TZ=Asia/Kolkata date +'%d %b %Y')
          LAST_AUTH="${{ steps.kite_check.outputs.kite_last_auth }}"
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${BREVO_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"sender\": { \"name\": \"BhaavBrief Watchdog\", \"email\": \"${SENDER_EMAIL}\" },
              \"to\": [{ \"email\": \"00tradingview00@gmail.com\" }],
              \"subject\": \"⚠️ Kite login not done today — ${DATE_LABEL}\",
              \"htmlContent\": \"<p>The daily Kite Connect login has not been done today (<strong>${DATE_LABEL}</strong>) — data/last-kite-auth.json still shows lastAuth: <strong>${LAST_AUTH}</strong>.</p><p>Options Chain, Strategy Builder, and today's IV/OI snapshots will fail or serve stale data until this is done. Fix: run <code>node scripts/kite-morning-auth.js</code> and complete the login.</p>\"
            }"
          echo "Alert sent for missing Kite login"
          exit 1

      - name: Alert — ATM IV snapshot missing
        if: steps.iv_check.outputs.iv_ok == 'false'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          DATE_LABEL="${{ steps.iv_check.outputs.iv_date }}"
          MISSING="${{ steps.iv_check.outputs.iv_missing }}"
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${BREVO_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"sender\": { \"name\": \"BhaavBrief Watchdog\", \"email\": \"${SENDER_EMAIL}\" },
              \"to\": [{ \"email\": \"00tradingview00@gmail.com\" }],
              \"subject\": \"⚠️ ATM IV snapshot missing for ${DATE_LABEL} —${MISSING}\",
              \"htmlContent\": \"<p>The daily ATM IV snapshot (Vercel Cron → /api/cron/iv-snapshot) did not record for <strong>${DATE_LABEL}</strong> for:<strong>${MISSING}</strong></p><p>Likely a silent skip (no futures price / no ATM IV from Kite at 23:35 IST) or an unhandled error — check the Vercel dashboard function logs for this route, since nothing else surfaces its failures.</p>\"
            }"
          echo "Alert sent for missing ATM IV snapshot"
          exit 1

      - name: Alert — OI-buildup snapshot missing
        if: steps.oi_check.outputs.oi_ok == 'false'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          DATE_LABEL="${{ steps.oi_check.outputs.oi_date }}"
          MISSING="${{ steps.oi_check.outputs.oi_missing }}"
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${BREVO_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"sender\": { \"name\": \"BhaavBrief Watchdog\", \"email\": \"${SENDER_EMAIL}\" },
              \"to\": [{ \"email\": \"00tradingview00@gmail.com\" }],
              \"subject\": \"⚠️ OI-buildup snapshot missing for ${DATE_LABEL} —${MISSING}\",
              \"htmlContent\": \"<p>The daily OI-buildup snapshot (Vercel Cron → /api/cron/oi-snapshot) did not record for <strong>${DATE_LABEL}</strong> for:<strong>${MISSING}</strong></p><p>This is a newer, less-hardened pipeline than the IV snapshot — check Vercel function logs for this route. Sold as 'OI Buildup 90-day' on the Pro page, so a gap here directly affects what paying customers see.</p>\"
            }"
          echo "Alert sent for missing OI-buildup snapshot"
          exit 1

      - name: Alert — Basis snapshot missing
        if: steps.basis_check.outputs.basis_ok == 'false'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          DATE_LABEL="${{ steps.basis_check.outputs.basis_date }}"
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${BREVO_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"sender\": { \"name\": \"BhaavBrief Watchdog\", \"email\": \"${SENDER_EMAIL}\" },
              \"to\": [{ \"email\": \"00tradingview00@gmail.com\" }],
              \"subject\": \"⚠️ Basis snapshot missing for ${DATE_LABEL}\",
              \"htmlContent\": \"<p>The daily Basis snapshot (scripts/fetch-snapshot.mjs → data/history/${DATE_LABEL}.json) was not committed for <strong>${DATE_LABEL}</strong>.</p><p>Check the generate-brief / evening-close-brief / flash-brief / intelligence-engine / site-guardian workflow runs for that day — any of them can write this file, so check which one(s) failed.</p>\"
            }"
          echo "Alert sent for missing Basis snapshot"
          exit 1
