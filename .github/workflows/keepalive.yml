name: Keepalive

on:
  schedule:
    # 8:55 AM IST Mon–Fri (3:25 AM UTC) — fires just before market open
    # Once-daily schedule is almost never skipped by GitHub's cron scheduler
    - cron: '25 3 * * 1-5'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Flash Intelligence
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/flash-brief.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Flash Intelligence triggered"

      - name: Trigger Intelligence Engine
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/intelligence-engine.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Intelligence Engine triggered"
