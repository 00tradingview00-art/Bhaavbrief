name: Keepalive

# Two-tier rescue strategy:
#
#  Tier 1 — Pre-market (3:25 AM UTC = 8:55 AM IST):
#    Triggers daily-open-brief, generate-brief, flash-brief, intelligence-engine
#    just before market open — ensures the morning brief always goes out even
#    if GitHub's cron scheduler drops those workflows' own schedules.
#
#  Tier 2 — Hourly during market hours (4:30–17:30 UTC = 10 AM–11 PM IST):
#    Triggers flash-brief and intelligence-engine every hour so a dropped 15-min
#    cron never goes undetected for more than 60 minutes.
#    generate-brief has its own date dedup so it's safe to trigger hourly too.

on:
  schedule:
    - cron: '25 3 * * 1-5'     # 8:55 AM IST — pre-market full trigger
    - cron: '30 4-17 * * 1-5'  # Every hour 10:00 AM – 11:00 PM IST — trading-hours backstop
    - cron: '20 18 * * 1-5'    # 11:50 PM IST — post-close evening brief rescue
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      # ── Pre-market only: kick off brief generation ─────────────────────────
      - name: Trigger Daily Open Brief (pre-market)
        if: github.event.schedule == '25 3 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-open-brief.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Daily Open Brief triggered"

      - name: Trigger Generate Brief (pre-market)
        if: github.event.schedule == '25 3 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/generate-brief.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Generate Brief triggered"

      # ── Every run (pre-market + hourly): rescue Flash + Intelligence ───────
      - name: Trigger Flash Intelligence
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/flash-brief.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Flash Intelligence triggered"

      - name: Trigger Intelligence Engine
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/intelligence-engine.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Intelligence Engine triggered"

      - name: Trigger Evening Close Brief (post-close only)
        if: github.event.schedule == '20 18 * * 1-5'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/evening-close-brief.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Evening Close Brief triggered"
