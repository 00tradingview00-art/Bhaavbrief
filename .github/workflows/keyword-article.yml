name: Daily Keyword Article

on:
  schedule:
    - cron: '0 1 * * 1-5'   # 6:30 AM IST Mon–Fri (before the 9 AM brief)
  workflow_dispatch:

concurrency:
  group: keyword-article
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate keyword article
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: node scripts/generate-keyword-article.js

      - name: Commit article
        run: |
          git config user.name  "BhaavBrief Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles/ data/keyword-coverage.json data/content-index.json
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "feat: keyword article $(date +%Y-%m-%d)"
          git push origin main || (git pull --rebase origin main && git push origin main)
