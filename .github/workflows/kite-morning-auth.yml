name: Kite Morning Auth

on:
  schedule:
    - cron: '15 3 * * 1-5'   # 3:15 AM UTC = 8:45 AM IST, Mon–Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kite-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Refresh Kite access token via headless TOTP login
      - name: Refresh Kite access token
        env:
          KITE_API_KEY:         ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET:      ${{ secrets.KITE_API_SECRET }}
          ZERODHA_USER_ID:      ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD:     ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_SECRET:  ${{ secrets.ZERODHA_TOTP_SECRET }}
          GITHUB_TOKEN:         ${{ secrets.GH_PAT }}
          GITHUB_REPO:          ${{ github.repository }}
          VERCEL_TOKEN:         ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:        ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID:    ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/kite-auto-token.mjs

      # Rediscover MCX instrument tokens — front-month contracts roll monthly
      - name: Discover MCX instrument tokens
        env:
          KITE_API_KEY:       ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN:  ${{ secrets.KITE_ACCESS_TOKEN }}
        run: node scripts/discover-instruments.mjs || echo "Instrument discovery skipped"

      - name: Commit updated instruments
        run: |
          git config user.name "BhaavBrief Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kite-instruments.json
          git diff --staged --quiet && echo "No instrument changes" && exit 0
          git commit -m "chore: update MCX instrument tokens $(date +'%d %b %Y')"
          git push origin main
