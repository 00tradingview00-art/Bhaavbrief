name: Kite Morning Auth

on:
  schedule:
    - cron: '15 3 * * 1-5'   # 3:15 AM UTC = 8:45 AM IST, Mon–Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kite-auth:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Rediscover MCX instrument tokens — front-month contracts roll monthly
      # Note: KITE_ACCESS_TOKEN is refreshed manually each morning via
      # `node scripts/kite-morning-auth.js` which pushes the token to
      # GitHub secrets and Vercel automatically.
      - name: Discover MCX instrument tokens
        env:
          KITE_API_KEY:       ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN:  ${{ secrets.KITE_ACCESS_TOKEN }}
        run: node scripts/discover-instruments.mjs

      - name: Fetch MCX contract specs
        env:
          KITE_API_KEY:       ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN:  ${{ secrets.KITE_ACCESS_TOKEN }}
        run: node scripts/fetch-contract-specs.js

      - name: Commit updated instruments and specs
        run: |
          git config user.name "BhaavBrief Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kite-instruments.json data/contract-specs.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update MCX instrument tokens and contract specs $(date +'%d %b %Y')"
          git push origin main

      - name: Alert on failure
        if: failure()
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"sender":{"name":"BhaavBrief Bot","email":"${{ secrets.SENDER_EMAIL }}"},"to":[{"email":"00tradingview00@gmail.com"}],"subject":"ACTION REQUIRED: Kite Morning Auth failed — '$(TZ=Asia/Kolkata date +'%d %b %Y')'","htmlContent":"<p><strong>Kite Morning Auth</strong> workflow failed on <strong>'$(TZ=Asia/Kolkata date +'%d %b %Y, %I:%M %p IST')'</strong>.</p><p><a href=\"https://github.com/${{ github.repository }}/actions/workflows/kite-morning-auth.yml\">Re-run workflow →</a></p>"}'
