name: Tests

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'scripts/**'
      - 'app/**'
      - 'components/**'
      - 'config/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'scripts/**'
      - 'app/**'
      - 'components/**'
      - 'config/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: P-02 route manifest check
        run: node scripts/check-route-manifest.mjs

      - name: P-03 ISR revalidate policy check
        run: node scripts/check-revalidate-policy.mjs

      - name: Commodity constants consistency check
        run: node scripts/check-commodity-constants.mjs

      - name: KB freshness check
        run: node scripts/check-kb-freshness.mjs
