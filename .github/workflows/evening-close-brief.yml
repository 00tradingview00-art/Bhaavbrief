name: BhaavBrief Evening MCX Close Brief

on:
  schedule:
    # 9:00 PM IST = 3:30 PM UTC, Mon–Fri (COMEX/NYMEX in full session)
    - cron: '30 15 * * 1-5'
  workflow_dispatch:

# Only one evening brief per run — queue if a manual dispatch overlaps the
# schedule, never cancel in progress. Was previously missing here (unlike
# generate-brief.yml, which has always had this) — a latent duplicate-commit
# risk found during the D-04 investigation, not yet triggered in practice.
concurrency:
  group: evening-close-brief
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  close-brief:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 15

    steps:
      # ref: main, not the commit that triggered the run: a run queued behind
      # another (schedule + keepalive rescue + manual dispatch) otherwise
      # checks out a tree without the brief the first run just pushed, and
      # publishes a second one for the same session (happened 21 & 22 Sep).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No continue-on-error: a failed snapshot used to let the brief be
      # generated and gated against hours-old prices (29 Sep: blocked as
      # STALE, 196 min). Failing here reaches the alert step below instead.
      - name: Fetch market snapshot
        env:
          KITE_API_KEY:      ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: node scripts/fetch-snapshot.mjs

      - name: Generate Evening Close Brief
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KITE_API_KEY:      ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: |
          OUTPUT=$(node scripts/evening-close-brief.js 2>&1)
          echo "$OUTPUT"
          BRIEF_FILE=$(echo "$OUTPUT" | grep '^BRIEF_FILE=' | cut -d= -f2-)
          echo "brief_file=${BRIEF_FILE}" >> $GITHUB_OUTPUT

      - name: Validate brief (publish gate)
        id: validate
        if: steps.generate.outputs.brief_file != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f "${{ steps.generate.outputs.brief_file }}" ]; then
            # Exit-code contract (0=pass, 1=legit rejection, 2=gate-internal
            # failure) — see validate-brief.mjs and generate-brief.yml for the
            # full rationale. Same fix applied here for consistency.
            set +e
            node scripts/validate-brief.mjs data/market-snapshot.json "${{ steps.generate.outputs.brief_file }}" evening-close
            CODE=$?
            set -e
            echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
            exit $CODE
          else
            echo "Brief file not found — skipping validation"
          fi

      - name: Commit & push
        id: commit
        run: |
          git config user.name "BhaavBrief Intelligence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/market-snapshot.json /tmp/bb-snapshot.json 2>/dev/null || true
          git add -A
          git checkout HEAD -- data/market-snapshot.json 2>/dev/null || true
          git stash
          git pull --rebase origin main
          git stash pop || true
          cp /tmp/bb-snapshot.json data/market-snapshot.json 2>/dev/null || true
          git add content/articles/ data/evening-brief-state.json data/market-snapshot.json
          [ -f data/gate-log.jsonl ] && git add data/gate-log.jsonl || true
          [ -d data/history ] && git add data/history/ || true
          git diff --staged --quiet && echo "No new brief" && exit 0
          DATE_IST=$(TZ=Asia/Kolkata date '+%a %d %b %Y')
          git commit -m "MCX Close Brief — ${DATE_IST}"
          for attempt in 1 2 3; do
            git push origin main && break
            if [ $attempt -lt 3 ]; then
              echo "Push attempt $attempt rejected — rebasing and retrying..."
              git pull --rebase origin main || { git rebase --abort; exit 1; }
              sleep $((attempt * 3))
            else
              echo "::error::Push failed after 3 attempts"
              exit 1
            fi
          done

      # A rejection (gate exit 1) ends the job before the commit step, so the
      # committed gate log only ever recorded passing runs — the digest's pass
      # rate was survivorship-biased. Commit just the log line for it. Not an
      # alertable failure: the run already failed as a legitimate rejection.
      - name: Record rejected brief in gate log
        if: failure() && steps.validate.outputs.exit_code == '1'
        continue-on-error: true
        run: |
          git config user.name "BhaavBrief Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gate-log.jsonl
          if git diff --cached --quiet; then echo "No gate-log change"; exit 0; fi
          git commit -q -m "chore: record rejected ${{ github.workflow }} gate run [skip ci]"
          git stash push --include-untracked -q || true   # the rejected draft stays unpublished
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::warning::Could not push the rejected-run gate-log entry"

      - name: Alert on failure
        # Alert on infrastructure failures, or a gate-internal failure (validate
        # exit code 2) — not when validate exited 1 (a legitimate content
        # rejection). See validate-brief.mjs's exit-code contract.
        if: failure() && steps.validate.outputs.exit_code != '1'
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "sender": { "name": "BhaavBrief Bot", "email": "${{ secrets.SENDER_EMAIL }}" },
              "to": [{ "email": "00tradingview00@gmail.com" }],
              "subject": "ACTION REQUIRED: MCX Close Brief pipeline failed — '"$(TZ=Asia/Kolkata date +'%d %b %Y')"'",
              "htmlContent": "<p>The <strong>Evening MCX Close Brief</strong> workflow failed on <strong>'"$(TZ=Asia/Kolkata date +'%d %b %Y, %I:%M %p IST')"'</strong>.</p><p><a href=\"https://github.com/${{ github.repository }}/actions/workflows/evening-close-brief.yml\">Re-run workflow →</a></p>"
            }'
