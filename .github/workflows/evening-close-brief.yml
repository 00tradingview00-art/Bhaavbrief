name: BhaavBrief Evening MCX Close Brief

on:
  schedule:
    # 11:45 PM IST = 6:15 PM UTC, Mon–Fri (15 min after MCX close at 11:30 PM)
    - cron: '15 18 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-brief:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Evening Close Brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KITE_API_KEY:      ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: node scripts/evening-close-brief.js

      - name: Commit & push
        run: |
          git config user.name "BhaavBrief Intelligence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add content/articles/ data/evening-brief-state.json
          git diff --staged --quiet && echo "No new brief" && exit 0
          DATE_IST=$(TZ=Asia/Kolkata date '+%a %d %b %Y')
          git commit -m "🌙 MCX Close Brief — ${DATE_IST}"
          git push origin main

      - name: Alert on failure
        if: failure()
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "sender": { "name": "BhaavBrief Bot", "email": "${{ secrets.SENDER_EMAIL }}" },
              "to": [{ "email": "00tradingview00@gmail.com" }],
              "subject": "ACTION REQUIRED: MCX Close Brief pipeline failed — '"$(TZ=Asia/Kolkata date +'%d %b %Y')"'",
              "htmlContent": "<p>The <strong>Evening MCX Close Brief</strong> workflow failed on <strong>'"$(TZ=Asia/Kolkata date +'%d %b %Y, %I:%M %p IST')"'</strong>.</p><p><a href=\"https://github.com/${{ github.repository }}/actions/workflows/evening-close-brief.yml\">Re-run workflow →</a></p>"
            }'
