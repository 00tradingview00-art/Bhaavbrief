name: Flash Intelligence

on:
  schedule:
    # MCX market hours: 9:00 AM – 11:30 PM IST = 3:30 AM – 6:00 PM UTC, Mon–Fri
    # Offset by 7 min from intelligence-engine.yml (fires at :00/:15/:30/:45)
    # to prevent simultaneous git push collisions on main.
    - cron: '7,22,37,52 3-17 * * 1-5'   # 9:07 AM – 11:22 PM IST
    - cron: '7,22,37 18 * * 1-5'         # 11:37 PM IST final window
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flash:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch flash articles
        id: flash
        run: node scripts/fetch-flash.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate AI news feed
        id: news
        run: node scripts/generate-news.js
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          KITE_API_KEY:         ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN:    ${{ secrets.KITE_ACCESS_TOKEN }}
          TWELVE_DATA_API_KEY:  ${{ secrets.TWELVE_DATA_API_KEY }}
          ALPHA_VANTAGE_KEY:    ${{ secrets.ALPHA_VANTAGE_KEY }}

      - name: Monitor MCX/SEBI circulars
        run: node scripts/monitor-mcx-circulars.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push
        run: |
          git config user.name "BhaavBrief Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/flash/ scripts/seen-articles.json scripts/seen-circulars.json data/ai-news.json scripts/seen-news.json
          if git diff --staged --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          FLASH=$(git diff --staged --name-only -- content/flash/ | grep -c '\.mdx$' || true)
          NEWS=$(git diff --staged --name-only -- data/ai-news.json | grep -c '.' || true)
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add content/flash/ scripts/seen-articles.json scripts/seen-circulars.json data/ai-news.json scripts/seen-news.json
          git diff --staged --quiet && echo "Nothing after rebase" && exit 0
          git commit -m "intelligence: ${FLASH} flash, ${NEWS:+news updated} $(date -u '+%H:%M UTC')"
          git push origin main
