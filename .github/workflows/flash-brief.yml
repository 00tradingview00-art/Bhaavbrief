name: Flash Intelligence

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch flash articles
        id: flash
        run: node scripts/fetch-flash.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate AI news feed
        id: news
        run: node scripts/generate-news.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KITE_API_KEY:      ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "BhaavBrief Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/flash/ scripts/seen-articles.json data/ai-news.json scripts/seen-news.json
          if git diff --staged --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          FLASH=$(git diff --staged --name-only -- content/flash/ | grep -c '\.mdx$' || true)
          NEWS=$(git diff --staged --name-only -- data/ai-news.json | grep -c '.' || true)
          git commit -m "intelligence: ${FLASH} flash, ${NEWS:+news updated} $(date -u '+%H:%M UTC')"
          git push
