name: Flash Intelligence

on:
  schedule:
    # MCX market hours: 9:00 AM – 11:30 PM IST = 3:30 AM – 6:00 PM UTC, Mon–Fri
    # Offset by 7 min from intelligence-engine.yml to prevent git push collisions.
    - cron: '7,22,37,52 3-17 * * 1-5'   # 9:07 AM – 11:22 PM IST
    - cron: '7,22,37 18 * * 1-5'         # 11:37 PM IST final window
    # No runs 12 AM – 8 AM IST — MCX closed, not worth the API spend.
  workflow_dispatch:

# Queue concurrent keepalive/cron runs — never cancel to avoid partial commits
concurrency:
  group: flash-intelligence
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  flash:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # continue-on-error on every content step so one API failure doesn't kill
      # the workflow and cause GitHub to disable the cron schedule.

      - name: Fetch market snapshot
        continue-on-error: true
        run: node scripts/fetch-snapshot.mjs
        env:
          KITE_API_KEY:        ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN:   ${{ secrets.KITE_ACCESS_TOKEN }}

      - name: Flash monitor (trigger-based T1+T2)
        continue-on-error: true
        run: node scripts/flash-monitor.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KITE_API_KEY:      ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}

      - name: Monitor MCX/SEBI circulars
        continue-on-error: true
        run: node scripts/monitor-mcx-circulars.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}

      - name: Commit and push
        run: |
          git config user.name "BhaavBrief Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage trigger-based flash articles, state, circulars, and gate log.
          # market-snapshot.json intentionally excluded — intelligence-engine owns it.
          git add content/flash/ scripts/seen-circulars.json \
                  data/flash-state.json data/gate-log.jsonl
          if git diff --staged --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          FLASH=$(git diff --staged --name-only -- content/flash/ | grep -c '\.mdx$' || true)
          # Discard snapshot/history side-effects before stashing — intelligence-engine
          # owns them and pushing them here causes rebase conflicts.
          git checkout -- data/market-snapshot.json 2>/dev/null || true
          git checkout -- data/history 2>/dev/null || true
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add content/flash/ scripts/seen-circulars.json \
                  data/flash-state.json data/gate-log.jsonl
          git diff --staged --quiet && echo "Nothing after rebase" && exit 0
          git commit -m "flash: ${FLASH} signal(s) $(date -u '+%H:%M UTC')"
          for attempt in 1 2 3; do
            git push origin main && break
            if [ $attempt -lt 3 ]; then
              echo "Push attempt $attempt rejected — rebasing and retrying..."
              git pull --rebase origin main || { git rebase --abort; exit 1; }
              sleep $((attempt * 3))
            fi
          done

      - name: Alert on failure
        if: failure()
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          REPO: ${{ github.repository }}
        run: |
          DATE_IN=$(TZ=Asia/Kolkata date '+%d %b %Y')
          TIME_IN=$(TZ=Asia/Kolkata date '+%d %b %Y, %I:%M %p IST')
          LINK="https://github.com/${REPO}/actions/workflows/flash-brief.yml"
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${BREVO_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"sender\":{\"name\":\"BhaavBrief Bot\",\"email\":\"${SENDER_EMAIL}\"},\"to\":[{\"email\":\"00tradingview00@gmail.com\"}],\"subject\":\"ACTION REQUIRED: Flash Intelligence failed -- ${DATE_IN}\",\"htmlContent\":\"<p>Flash Intelligence workflow failed on ${TIME_IN}.</p><p><a href='${LINK}'>Re-run workflow</a></p>\"}" \
            || true
