name: Publish Pro Weekly Catalyst

on:
  schedule:
    # Minute offset from :00 — GitHub Actions documents exact-top-of-hour cron
    # firings as the most likely to be delayed or dropped under load; this
    # missed its first-ever run entirely on 2026-09-26 with zero runs logged.
    - cron: '7 4 * * 6' # Saturday ~9:37 AM IST, after Friday's MCX close
  workflow_dispatch:

concurrency:
  group: weekly-catalyst
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Generate Friday-close Weekly Catalyst
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/generate-weekly-catalyst.mjs
      - name: Validate and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          FILE="content/research/$(TZ=Asia/Kolkata date +%Y-%m-%d)-weekly-catalyst.mdx"
          node scripts/validate-research.mjs "$FILE"
          sed -i 's/^published: false$/published: true/' "$FILE"
          node scripts/build-content-index.js
      - name: Commit published Catalyst
        run: |
          git config user.name "BhaavBrief Research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/ data/content-index.json data/gate-log.jsonl
          git diff --staged --quiet && exit 0
          git commit -m "feat(research): Weekly Catalyst $(TZ=Asia/Kolkata date +%Y-%m-%d)"
          git push origin main

      - name: Alert on failure
        if: failure()
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          REPO: ${{ github.repository }}
        run: |
          TIME_IN=$(TZ=Asia/Kolkata date '+%d %b %Y, %I:%M %p IST')
          LINK="https://github.com/${REPO}/actions/workflows/weekly-catalyst.yml"
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${BREVO_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"sender\":{\"name\":\"BhaavBrief Bot\",\"email\":\"${SENDER_EMAIL}\"},\"to\":[{\"email\":\"00tradingview00@gmail.com\"}],\"subject\":\"ACTION REQUIRED: Weekly Catalyst failed -- ${TIME_IN}\",\"htmlContent\":\"<p>Weekly Catalyst workflow failed on ${TIME_IN}.</p><p><a href='${LINK}'>Re-run workflow</a></p>\"}" \
            || true
