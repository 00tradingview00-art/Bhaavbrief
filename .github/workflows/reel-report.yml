name: Weekly Reel Report

# Sends the founder a weekly email on Instagram Reels performance (views,
# reach, watch-time, chart coverage, follower delta) — the visibility that
# was previously only available by reading data/reel-history.json by hand.
# Modeled on telemetry-digest.yml's skeleton; Monday morning IST so last
# week's numbers are the first thing seen at the start of the week.

on:
  schedule:
    - cron: '0 3 * * 1'  # Monday 8:30 AM IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send weekly reel report
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: node scripts/generate-reel-report.mjs
