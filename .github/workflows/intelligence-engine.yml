name: BhaavBrief Intelligence Engine

on:
  schedule:
    # Every 15 min, Mon–Fri, 3:30 AM–6:00 PM UTC = 9:00 AM–11:30 PM IST
    - cron: '*/15 3-17 * * 1-5'   # 9 AM – 11 PM IST
    - cron: '0,15,30 18 * * 1-5'  # 11 PM – 11:30 PM IST final window
  workflow_dispatch:               # Manual trigger anytime

# Queue concurrent runs — never cancel to avoid partial commits
concurrency:
  group: intelligence-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  intelligence:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch market snapshot
        continue-on-error: true
        env:
          KITE_API_KEY:       ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET:    ${{ secrets.KITE_API_SECRET }}
          KITE_ACCESS_TOKEN:  ${{ secrets.KITE_ACCESS_TOKEN }}
        run: node scripts/fetch-snapshot.mjs

      - name: Run Intelligence Engine
        id: engine
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          EIA_API_KEY:        ${{ secrets.EIA_API_KEY }}
          KITE_API_KEY:       ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET:    ${{ secrets.KITE_API_SECRET }}
          KITE_ACCESS_TOKEN:  ${{ secrets.KITE_ACCESS_TOKEN }}
        run: node scripts/intelligence-engine.js

      - name: Rebuild content search index
        continue-on-error: true
        run: node scripts/build-content-index.js

      - name: Commit & push if article published
        run: |
          git config user.name "BhaavBrief Intelligence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/market-snapshot.json /tmp/bb-snapshot.json 2>/dev/null || true
          git add -A
          git checkout HEAD -- data/market-snapshot.json 2>/dev/null || true
          git stash
          git pull --rebase origin main
          git stash pop || true
          cp /tmp/bb-snapshot.json data/market-snapshot.json 2>/dev/null || true
          git add content/articles/ data/content-index.json
          git add data/last-article-title.txt data/mcx-last-prices.json 2>/dev/null || true
          git add data/market-snapshot.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          HAS_ARTICLE=$(git diff --staged --name-only -- content/articles/ | grep -c '\.mdx$' || true)
          if [ "$HAS_ARTICLE" -gt 0 ]; then
            git add data/engine-state.json
            TITLE=$(cat data/last-article-title.txt 2>/dev/null || echo "Market Update")
            git commit -m "⚡ Flash: ${TITLE}"
          else
            git commit -m "chore: snapshot $(date -u '+%H:%M UTC')"
          fi
          git push origin main

      - name: Alert on failure
        if: failure()
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"sender":{"name":"BhaavBrief Bot","email":"${{ secrets.SENDER_EMAIL }}"},"to":[{"email":"00tradingview00@gmail.com"}],"subject":"ACTION REQUIRED: Intelligence Engine failed — '$(TZ=Asia/Kolkata date +'%d %b %Y')'","htmlContent":"<p><strong>Intelligence Engine</strong> workflow failed on <strong>'$(TZ=Asia/Kolkata date +'%d %b %Y, %I:%M %p IST')'</strong>.</p><p><a href=\"https://github.com/${{ github.repository }}/actions/workflows/intelligence-engine.yml\">Re-run workflow →</a></p>"}'
