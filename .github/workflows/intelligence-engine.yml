name: BhaavBrief Intelligence Engine

on:
  schedule:
    # Every 15 min, Mon–Fri, 3:30 AM–6:00 PM UTC = 9:00 AM–11:30 PM IST
    - cron: '*/15 3-17 * * 1-5'   # 9 AM – 11 PM IST
    - cron: '0,15,30 18 * * 1-5'  # 11 PM – 11:30 PM IST final window
  workflow_dispatch:               # Manual trigger anytime

permissions:
  contents: write

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Intelligence Engine
        id: engine
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          EIA_API_KEY:        ${{ secrets.EIA_API_KEY }}
          KITE_API_KEY:       ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET:    ${{ secrets.KITE_API_SECRET }}
          KITE_ACCESS_TOKEN:  ${{ secrets.KITE_ACCESS_TOKEN }}
        run: node scripts/intelligence-engine.js

      - name: Commit & push if article published
        run: |
          git config user.name "BhaavBrief Intelligence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add content/articles/ data/engine-state.json
          git add data/last-article-title.txt 2>/dev/null || true
          git diff --staged --quiet && echo "No new articles" && exit 0
          TITLE=$(cat data/last-article-title.txt 2>/dev/null || echo "Market Update")
          git commit -m "⚡ Flash: ${TITLE}"
          git push origin main
