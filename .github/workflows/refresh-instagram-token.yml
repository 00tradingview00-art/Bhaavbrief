name: Refresh Instagram Token

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 6 AM UTC — refreshes well before 60-day expiry
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 5

    steps:
      - name: Refresh long-lived Instagram access token
        id: refresh
        run: |
          RESPONSE=$(curl -s "https://graph.facebook.com/v22.0/refresh_access_token?grant_type=ig_refresh_token&access_token=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}")
          echo "Meta API response: $RESPONSE"

          NEW_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')
          EXPIRES_IN=$(echo "$RESPONSE" | jq -r '.expires_in // 0')
          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')

          if [ -n "$ERROR" ]; then
            echo "Token refresh error: $ERROR"
            # Exit 0 — don't break the workflow if Meta returns a transient error
            exit 0
          fi

          if [ -z "$NEW_TOKEN" ]; then
            echo "No token returned — skipping secret update"
            exit 0
          fi

          DAYS=$(( EXPIRES_IN / 86400 ))
          echo "Token refreshed — valid for ${DAYS} more days"
          echo "new_token=$NEW_TOKEN" >> $GITHUB_OUTPUT

      - name: Update INSTAGRAM_ACCESS_TOKEN secret
        run: |
          gh secret set INSTAGRAM_ACCESS_TOKEN \
            --body "${{ steps.refresh.outputs.new_token }}" \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
