name: Refresh Instagram Token

on:
  schedule:
    - cron: '0 6 */15 * *'  # Every 15 days — refreshes well before 60-day expiry
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Refresh long-lived Instagram access token
        id: refresh
        run: |
          RESPONSE=$(curl -s "https://graph.facebook.com/v22.0/oauth/access_token?grant_type=fb_exchange_token&client_id=${{ secrets.META_APP_ID }}&client_secret=${{ secrets.META_APP_SECRET }}&fb_exchange_token=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}")

          if ! echo "$RESPONSE" | jq . >/dev/null 2>&1; then
            echo "::error::Instagram refresh returned non-JSON — token expired. Run scripts/refresh-instagram-token.js locally."
            exit 1
          fi

          echo "Meta API response: $(echo "$RESPONSE" | jq -c 'del(.access_token)')"

          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR" ]; then
            echo "::error::Refresh failed: $ERROR — token expired. Run scripts/refresh-instagram-token.js locally."
            exit 1
          fi

          NEW_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')
          echo "::add-mask::$NEW_TOKEN"
          EXPIRES_IN=$(echo "$RESPONSE" | jq -r '.expires_in // 0')

          if [ -z "$NEW_TOKEN" ]; then
            echo "::warning::No token returned — skipping"
            exit 0
          fi

          DAYS=$(( EXPIRES_IN / 86400 ))
          echo "Token refreshed — valid for ${DAYS} more days"
          echo "new_token=$NEW_TOKEN" >> $GITHUB_OUTPUT

      - name: Update INSTAGRAM_ACCESS_TOKEN secret
        if: steps.refresh.outputs.new_token != ''
        run: |
          gh secret set INSTAGRAM_ACCESS_TOKEN \
            --body "${{ steps.refresh.outputs.new_token }}" \
            --repo ${{ github.repository }}
          echo "Secret updated successfully"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Alert on failure
        if: failure()
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "sender": { "name": "BhaavBrief Bot", "email": "${{ secrets.SENDER_EMAIL }}" },
              "to": [{ "email": "00tradingview00@gmail.com" }],
              "subject": "ACTION REQUIRED: Instagram token expired — manual refresh needed",
              "htmlContent": "<p>The Instagram token auto-refresh failed on <strong>'"$(date +'%d %b %Y')"'</strong>.</p><p>Run this locally to fix it:</p><pre>node scripts/refresh-instagram-token.js</pre><p>You need a fresh short-lived token from <a href=\"https://developers.facebook.com/tools/explorer/\">Graph API Explorer</a> plus META_APP_ID and META_APP_SECRET in .env.local.</p>"
            }'
