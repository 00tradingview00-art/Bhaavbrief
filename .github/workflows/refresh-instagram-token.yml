name: Refresh Instagram Token

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 6 AM UTC — refreshes well before 60-day expiry
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 5

    steps:
      - name: Refresh long-lived Instagram access token
        id: refresh
        run: |
          RESPONSE=$(curl -s "https://graph.facebook.com/v22.0/refresh_access_token?grant_type=ig_refresh_token&access_token=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}")
          echo "Meta API response: $RESPONSE"

          # Guard: if response isn't JSON (e.g. empty or HTML), jq will fail — treat as error
          if ! echo "$RESPONSE" | jq . >/dev/null 2>&1; then
            echo "::error::Instagram refresh returned non-JSON response — token may be expired. Paste a new token manually."
            exit 1
          fi

          NEW_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')
          EXPIRES_IN=$(echo "$RESPONSE" | jq -r '.expires_in // 0')
          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')

          if [ -n "$ERROR" ]; then
            echo "::error::Instagram token refresh failed: $ERROR — token is expired or invalid. Go to developers.facebook.com and generate a new token."
            exit 1
          fi

          if [ -z "$NEW_TOKEN" ]; then
            echo "::warning::No token returned from Meta — skipping secret update"
            exit 0
          fi

          DAYS=$(( EXPIRES_IN / 86400 ))
          echo "Token refreshed — valid for ${DAYS} more days"
          echo "new_token=$NEW_TOKEN" >> $GITHUB_OUTPUT

      - name: Update INSTAGRAM_ACCESS_TOKEN secret
        if: steps.refresh.outputs.new_token != ''
        run: |
          gh secret set INSTAGRAM_ACCESS_TOKEN \
            --body "${{ steps.refresh.outputs.new_token }}" \
            --repo ${{ github.repository }}
          echo "Secret updated successfully"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Alert on failure
        if: failure()
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "sender": { "name": "BhaavBrief Bot", "email": "${{ secrets.SENDER_EMAIL }}" },
              "to": [{ "email": "00tradingview00@gmail.com" }],
              "subject": "ACTION REQUIRED: Instagram token refresh failed",
              "htmlContent": "<p>The weekly Instagram token auto-refresh failed on <strong>'"$(date +'%d %b %Y')"'</strong>.</p><p>Instagram posts will stop working within days. Go to <a href=\"https://developers.facebook.com\">developers.facebook.com</a>, generate a new long-lived token, and run the <em>Refresh Instagram Token</em> workflow manually with the new token in the secret.</p><p><a href=\"https://github.com/${{ github.repository }}/actions/workflows/refresh-instagram-token.yml\">View workflow →</a></p>"
            }'
          echo "Alert email sent"
