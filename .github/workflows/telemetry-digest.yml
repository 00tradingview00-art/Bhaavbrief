name: Weekly Telemetry Digest

# Part 4.2 — batches everything that isn't S1 into one Friday message
# instead of paging in real time (alert-fatigue rule). Matches the Part 11.2
# weekly self-audit cadence.

on:
  schedule:
    - cron: '0 12 * * 5'  # Friday 5:30 PM IST
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send weekly telemetry digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/send-telemetry-digest.mjs
