name: Post to Instagram

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition number (e.g. 36). Leave blank to use latest.'
        required: false
        default: ''
  workflow_call:
    inputs:
      edition:
        description: 'Edition number passed from calling workflow'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Resolve edition number
        id: edition
        run: |
          INPUT="${{ github.event.inputs.edition }}${{ inputs.edition }}"
          if [ -n "$INPUT" ]; then
            echo "number=$INPUT" >> $GITHUB_OUTPUT
          else
            LAST=$(ls content/briefs/ 2>/dev/null | grep -oP '(?<=edition-)\d+' | sort -n | tail -1)
            echo "number=${LAST:-1}" >> $GITHUB_OUTPUT
            echo "Using latest edition: $LAST"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Post edition card to Instagram
        env:
          EDITION:                ${{ steps.edition.outputs.number }}
          INSTAGRAM_USER_ID:      ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node scripts/post-instagram.js

      - name: Post P&L card to Instagram
        continue-on-error: true
        env:
          INSTAGRAM_USER_ID:      ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          EDITION="${{ steps.edition.outputs.number }}"
          SLUG="edition-$(printf '%03d' "$EDITION")-pnl"
          export IMAGE_URL="https://bhaavbrief.in/instagram/${SLUG}.jpg?v=${{ github.run_id }}"
          export CAPTION="$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "Today's move, in your pocket." \
            "What 1 MCX Mini lot would have made or lost today — before you analyse the chart." \
            "Full brief → bhaavbrief.in/briefs/edition-$(printf '%03d' "$EDITION")" \
            "#BhaavBrief #MCX #MCXGold #MCXCrude #MCXSilver #CommodityMarkets #MCXTrading #IndianMarkets #MCXIntelligence")"
          node scripts/post-image-instagram.js
