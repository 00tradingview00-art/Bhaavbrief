name: Send Newsletter

# generate-brief.yml already sends the newsletter inline after publishing.
# This workflow is kept for manual re-send only (e.g. if the inline send failed).
on:
  workflow_dispatch:
    inputs:
      brief_file:
        description: 'Brief file path (e.g. content/briefs/edition-042.mdx)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get latest brief file (if none specified)
        id: brief
        run: |
          if [ -n "${{ github.event.inputs.brief_file }}" ]; then
            echo "file=${{ github.event.inputs.brief_file }}" >> $GITHUB_OUTPUT
          else
            LATEST=$(ls -t content/briefs/*.mdx 2>/dev/null | head -1)
            echo "file=$LATEST" >> $GITHUB_OUTPUT
            echo "Using latest brief: $LATEST"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Send newsletter via Brevo
        if: steps.brief.outputs.file != ''
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          SENDER_EMAIL:  ${{ secrets.SENDER_EMAIL }}
          BRIEF_FILE:    ${{ steps.brief.outputs.file }}
        run: node scripts/send-newsletter.js

      - name: Alert on failure
        if: failure()
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "sender": { "name": "BhaavBrief Bot", "email": "${{ secrets.SENDER_EMAIL }}" },
              "to": [{ "email": "00tradingview00@gmail.com" }],
              "subject": "ACTION REQUIRED: Newsletter send failed — '"$(TZ=Asia/Kolkata date +'%d %b %Y')"'",
              "htmlContent": "<p>The <strong>Send Newsletter</strong> workflow failed on <strong>'"$(TZ=Asia/Kolkata date +'%d %b %Y, %I:%M %p IST')"'</strong>. Subscribers may not have received today'\''s brief.</p><p><a href=\"https://github.com/${{ github.repository }}/actions/workflows/send-newsletter.yml\">Re-run workflow →</a></p>"
            }'
