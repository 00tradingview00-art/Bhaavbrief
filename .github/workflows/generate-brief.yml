name: Generate Daily Brief

on:
  schedule:
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get next edition number
        id: edition
        run: |
          LAST=$(ls content/briefs/ | grep -oP '\d+' | sort -n | tail -1)
          NEXT=$((${LAST:-0} + 1))
          echo "number=$NEXT" >> $GITHUB_OUTPUT

      - name: Generate brief MDX
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDITION: ${{ steps.edition.outputs.number }}
        run: node scripts/generate-brief.js

      - name: Commit directly to main
        env:
          EDITION: ${{ steps.edition.outputs.number }}
        run: |
          git config user.name "BhaavBrief Bot"
          git config user.email "brief@bhaavbrief.in"
          git add -A
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add content/briefs/
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Brief #${EDITION} — $(date +'%d %b %Y')"
          git push origin main

      - name: Wait for deploy then send newsletter
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EDITION: ${{ steps.edition.outputs.number }}
        run: |
          sleep 180
          node scripts/send-newsletter.js
