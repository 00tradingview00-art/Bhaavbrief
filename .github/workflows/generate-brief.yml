name: Generate Daily Brief

on:
  schedule:
    - cron: '30 3 * * 1-5'  # 9:00 AM IST Mon–Fri
  workflow_dispatch:

# Only one brief per run — queue if keepalive also fires, never cancel in progress
concurrency:
  group: generate-brief
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get next edition number
        id: edition
        run: |
          LAST=$(ls content/briefs/ 2>/dev/null | grep -oP '(?<=edition-)\d+' | sort -n | tail -1)
          NEXT=$(( 10#${LAST:-0} + 1 ))
          echo "number=$NEXT" >> $GITHUB_OUTPUT

      # Runs before generation so yesterday's-or-older reels get their
      # settled Meta insights written into data/reel-history.json (committed
      # by the "Persist reel history" step at the end of this job).
      - name: Fetch reel insights
        continue-on-error: true
        env:
          INSTAGRAM_USER_ID:      ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node scripts/fetch-reel-insights.mjs

      - name: Fetch market snapshot
        env:
          KITE_API_KEY:      ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: node scripts/fetch-snapshot.mjs

      - name: Generate brief MDX
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDITION: ${{ steps.edition.outputs.number }}
        run: node scripts/generate-brief.js

      - name: Validate brief (publish gate)
        id: validate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDITION: ${{ steps.edition.outputs.number }}
        run: |
          PADDED=$(printf '%03d' $EDITION)
          BRIEF="content/briefs/edition-${PADDED}.mdx"
          if [ ! -f "$BRIEF" ]; then
            echo "No new brief generated (already published today or skipped) — skipping validation"
            exit 0
          fi
          # Capture the gate's exit code explicitly (0=pass, 1=legit content
          # rejection, 2=gate-internal failure) so "Alert on failure" below can
          # tell "gate correctly rejected bad content" (stay silent) apart from
          # "gate itself couldn't run" (must alert) — see validate-brief.mjs's
          # exit-code contract. Root cause of the 2026-07-16 missed brief was
          # this distinction not existing: a validate-gate API error and a real
          # content rejection looked identical to this workflow.
          set +e
          node scripts/validate-brief.mjs data/market-snapshot.json "$BRIEF"
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit $CODE

      - name: Compliance lint (banned-phrase scan)
        id: compliance
        env:
          EDITION: ${{ steps.edition.outputs.number }}
        run: |
          PADDED=$(printf '%03d' $EDITION)
          BRIEF="content/briefs/edition-${PADDED}.mdx"
          if [ ! -f "$BRIEF" ]; then
            echo "No new brief generated — skipping compliance lint"
            exit 0
          fi
          node scripts/compliance-lint.mjs data/market-snapshot.json "$BRIEF"

      - name: Apply human approval gate (G-12)
        id: humangate
        env:
          EDITION: ${{ steps.edition.outputs.number }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PADDED=$(printf '%03d' $EDITION)
          BRIEF="content/briefs/edition-${PADDED}.mdx"
          if [ ! -f "$BRIEF" ]; then
            echo "No new brief generated — skipping human gate"
            echo "staged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Dormant unless TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID are both set —
          # see scripts/apply-human-gate.mjs's own safety-net comment. Until
          # 30 consecutive clean gate passes accumulate, this rewrites the
          # brief to published:false and pings Telegram for approval instead
          # of publishing immediately.
          node scripts/apply-human-gate.mjs "$BRIEF" "$EDITION"
          if grep -q '^published: false' "$BRIEF"; then
            echo "staged=true" >> "$GITHUB_OUTPUT"
          else
            echo "staged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild content search index
        run: node scripts/build-content-index.js
        continue-on-error: true

      - name: Generate Instagram card
        env:
          EDITION: ${{ steps.edition.outputs.number }}
        run: |
          PADDED=$(printf '%03d' $EDITION)
          BRIEF="content/briefs/edition-${PADDED}.mdx"
          if [ ! -f "$BRIEF" ]; then
            echo "No new brief generated — skipping Instagram card"
            exit 0
          fi
          node scripts/generate-instagram-card.js
        continue-on-error: true

      - name: Generate P&L impact card
        env:
          EDITION: ${{ steps.edition.outputs.number }}
        run: node scripts/generate-pnl-card.js
        continue-on-error: true

      - name: Commit brief to main
        id: commit
        env:
          EDITION: ${{ steps.edition.outputs.number }}
        run: |
          git config user.name "BhaavBrief Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/market-snapshot.json /tmp/bb-snapshot.json 2>/dev/null || true
          git add -A
          git checkout HEAD -- data/market-snapshot.json 2>/dev/null || true
          git stash
          git pull --rebase origin main
          git stash pop || true
          cp /tmp/bb-snapshot.json data/market-snapshot.json 2>/dev/null || true
          # Commit brief + snapshot together — they must be one atomic commit
          # so the site and email can never show prices from different vintages.
          git add content/briefs/ data/market-snapshot.json data/content-index.json public/instagram/
          # Seeded in the repo so these always exist, but `git add` on a
          # missing path is a hard failure (exit 128) that would break this
          # entire step — verified directly before relying on it. Guarded
          # defensively in case either is ever absent for any reason.
          [ -f data/gate-streak.json ] && git add data/gate-streak.json || true
          [ -f data/gate-log.jsonl ] && git add data/gate-log.jsonl || true
          [ -d data/history ] && git add data/history/ || true
          if git diff --staged --quiet; then
            echo "Nothing to commit — brief already published today"
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "Brief #${EDITION} — $(date +'%d %b %Y')"
          for attempt in 1 2 3; do
            git push origin main && break
            if [ $attempt -lt 3 ]; then
              echo "Push attempt $attempt rejected — rebasing and retrying..."
              git pull --rebase origin main || { git rebase --abort; exit 1; }
              sleep $((attempt * 3))
            else
              echo "::error::Push failed after 3 attempts"
              exit 1
            fi
          done
          # A non-empty diff doesn't mean a new article was published — the
          # edition counter (Get next edition number) just scans the highest
          # existing file and always returns last+1 with no memory of "already
          # tried and skipped today", so a second same-day trigger recomputes
          # the same number generate-brief.js already declined to write. That
          # run still has a real diff to commit (market-snapshot.json/P&L card
          # refresh with live prices) and used to fall through to here and set
          # published=true anyway, which fired the newsletter/Instagram/reel
          # steps for an article that was never written (2026-08-19: caught
          # when a redundant trigger left "Brief not found" failures in
          # Generate Instagram card / Post to Instagram / Generate brief reel).
          PADDED=$(printf '%03d' $EDITION)
          BRIEF="content/briefs/edition-${PADDED}.mdx"
          if [ -f "$BRIEF" ]; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "Commit was data-only (no new brief article) — not marking published"
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Wait for Vercel deploy then send newsletter
        if: steps.commit.outputs.published == 'true' && steps.humangate.outputs.staged != 'true'
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          SENDER_EMAIL:  ${{ secrets.SENDER_EMAIL }}
          EDITION:       ${{ steps.edition.outputs.number }}
        run: |
          PADDED=$(printf '%03d' $EDITION)
          BRIEF_PATH="content/briefs/edition-${PADDED}.mdx"
          if [ ! -f "$BRIEF_PATH" ]; then
            echo "Brief file not found: $BRIEF_PATH — skipping newsletter"
            exit 0
          fi
          echo "Waiting 4 minutes for Vercel to deploy..."
          sleep 240
          node scripts/send-newsletter.js

      - name: Post to Instagram
        if: steps.commit.outputs.published == 'true' && steps.humangate.outputs.staged != 'true'
        continue-on-error: true
        env:
          EDITION:                  ${{ steps.edition.outputs.number }}
          INSTAGRAM_USER_ID:        ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN:   ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node scripts/post-instagram.js

      - name: Install ffmpeg
        if: steps.commit.outputs.published == 'true' && steps.humangate.outputs.staged != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate brief reel
        id: reel
        if: steps.commit.outputs.published == 'true' && steps.humangate.outputs.staged != 'true'
        continue-on-error: true
        env:
          EDITION:              ${{ steps.edition.outputs.number }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY:   ${{ secrets.ELEVENLABS_API_KEY }}
          KITE_API_KEY:         ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN:    ${{ secrets.KITE_ACCESS_TOKEN }}
        run: |
          node scripts/generate-brief-reel.mjs
          PADDED=$(printf '%03d' ${{ steps.edition.outputs.number }})
          echo "padded=$PADDED" >> $GITHUB_OUTPUT

      - name: Post reel to Instagram
        if: steps.commit.outputs.published == 'true' && steps.humangate.outputs.staged != 'true' && steps.reel.outcome == 'success'
        continue-on-error: true
        env:
          EDITION:                ${{ steps.edition.outputs.number }}
          REEL_FILE:              public/reels/brief-edition-${{ steps.reel.outputs.padded }}.mp4
          INSTAGRAM_USER_ID:      ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node scripts/post-reel-instagram.mjs

      # data/reel-history.json is written on the runner by fetch-reel-insights
      # (insights), generate-brief-reel (new entry), and post-reel-instagram
      # (instagram_id/posted_at) — all AFTER "Commit brief to main" pushed.
      # Without this step every one of those writes is discarded with the
      # runner, and fetch-reel-insights finds an empty history every day.
      - name: Persist reel history
        continue-on-error: true
        run: |
          if [ ! -f data/reel-history.json ]; then
            echo "No reel history file — nothing to persist"
            exit 0
          fi
          # Same save/restore-via-/tmp pattern as "Commit brief to main":
          # park our file, drop any other dirty tracked files so the rebase
          # is clean, then bring it back and commit just this one path.
          cp data/reel-history.json /tmp/bb-reel-history.json
          git checkout -- . 2>/dev/null || true
          git pull --rebase origin main
          cp /tmp/bb-reel-history.json data/reel-history.json
          git add data/reel-history.json
          if git diff --staged --quiet; then
            echo "Reel history unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "Reel history — $(date +'%d %b %Y')"
          for attempt in 1 2 3; do
            git push origin main && break
            if [ $attempt -lt 3 ]; then
              echo "Push attempt $attempt rejected — rebasing and retrying..."
              git pull --rebase origin main || { git rebase --abort; exit 1; }
              sleep $((attempt * 3))
            else
              echo "::error::Push failed after 3 attempts"
              exit 1
            fi
          done

      - name: Alert on failure
        # Alert on generation/commit failure, or a gate-internal failure (validate
        # exit code 2 — see validate-brief.mjs's exit-code contract). Stay silent
        # only when validate exited 1 (a legitimate content rejection — quality
        # control working as intended) or compliance-lint blocked a bad brief.
        # steps.validate.outputs.exit_code is empty if the validate step never ran
        # (e.g. an earlier step failed), which correctly falls through to alerting.
        if: failure() && steps.validate.outputs.exit_code != '1' && steps.compliance.outcome != 'failure'
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "sender": { "name": "BhaavBrief Bot", "email": "${{ secrets.SENDER_EMAIL }}" },
              "to": [{ "email": "00tradingview00@gmail.com" }],
              "subject": "ACTION REQUIRED: Daily brief pipeline failed — '"$(TZ=Asia/Kolkata date +'%d %b %Y')"'",
              "htmlContent": "<p>The <strong>Generate Daily Brief</strong> workflow failed on <strong>'"$(TZ=Asia/Kolkata date +'%d %b %Y, %I:%M %p IST')"'</strong>.</p><p>Today'\''s brief may not have been sent to subscribers. Trigger the workflow manually if needed.</p><p><a href=\"https://github.com/${{ github.repository }}/actions/workflows/generate-brief.yml\">Re-run workflow →</a></p>"
            }'
