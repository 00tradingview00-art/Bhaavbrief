name: Generate Daily Brief

on:
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Noto fonts (for Instagram card generation)
        run: sudo apt-get install -y --no-install-recommends fonts-noto-core

      - name: Get next edition number
        id: edition
        run: |
          LAST=$(ls content/briefs/ | grep -oP '(?<=edition-)\d+' | sort -n | tail -1)
          NEXT=$(( 10#${LAST:-0} + 1 ))
          echo "number=$NEXT" >> $GITHUB_OUTPUT

      - name: Generate brief MDX
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDITION: ${{ steps.edition.outputs.number }}
        run: node scripts/generate-brief.js

      - name: Rebuild content search index
        run: node scripts/build-content-index.js

      - name: Commit brief to main
        id: commit
        env:
          EDITION: ${{ steps.edition.outputs.number }}
        run: |
          git config user.name "BhaavBrief Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add content/briefs/ data/content-index.json
          if git diff --staged --quiet; then
            echo "Nothing to commit — skipping newsletter and Instagram"
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "Brief #${EDITION} — $(date +'%d %b %Y')"
          git push origin main
          echo "published=true" >> $GITHUB_OUTPUT

      - name: Generate Instagram card
        if: steps.commit.outputs.published == 'true'
        env:
          EDITION: ${{ steps.edition.outputs.number }}
        run: node scripts/generate-instagram-card.js

      - name: Commit Instagram card
        if: steps.commit.outputs.published == 'true'
        env:
          EDITION: ${{ steps.edition.outputs.number }}
        run: |
          git add public/instagram/
          if git diff --staged --quiet; then
            echo "No card to commit"
          else
            git commit -m "Instagram card — Edition #${EDITION}"
            git push origin main
          fi

      - name: Wait for deploy then send newsletter
        if: steps.commit.outputs.published == 'true'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EDITION: ${{ steps.edition.outputs.number }}
        run: |
          sleep 180
          node scripts/send-newsletter.js

      - name: Post to Instagram
        if: steps.commit.outputs.published == 'true'
        env:
          EDITION: ${{ steps.edition.outputs.number }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/post-instagram.js
