name: Generate BhaavBrief

on:
  schedule:
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate brief
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-brief.js

      - name: Commit and push to main
        env:
          BRIEF_EDITION: ${{ steps.generate.outputs.edition }}
          BRIEF_TITLE: ${{ steps.generate.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/briefs/
          git commit -m "brief: add edition ${BRIEF_EDITION} -- ${BRIEF_TITLE}"
          git push origin main
