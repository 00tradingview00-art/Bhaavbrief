name: Refresh Event Impact Stats

on:
  schedule:
    # Monday 3:45 AM UTC = 9:15 AM IST — 30 min after kite-morning-auth.yml's
    # Monday run (3:15 AM UTC), so this always has a fresh Kite token. Kept off
    # weekends deliberately: kite-morning-auth only runs Mon-Fri, so a weekend
    # run here would hit an expired token.
    - cron: '45 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Fetch EIA actuals
        id: eia_fetch
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: node scripts/fetch-eia-data.mjs

      - name: Fetch CFTC COT positioning
        id: cftc_fetch
        continue-on-error: true
        # Free public Socrata dataset — no API key required.
        run: node scripts/fetch-cftc-data.mjs

      - name: Roll forward rule-based event dates
        run: node scripts/refresh-event-calendar.mjs

      - name: Compute event impact stats
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: node scripts/compute-event-impact.mjs

      - name: Validate event-map.json schema
        run: node scripts/validate-event-map.mjs

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/event-map.json data/event-impact-stats.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: refresh event impact stats [skip ci]"
          # Other workflows commit to main constantly — rebase and retry.
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push origin main && exit 0
            sleep $((i * 5))
          done
          echo "::error::Push failed after 3 attempts"
          exit 1

      - name: Surface EIA fetch failure
        if: steps.eia_fetch.outcome == 'failure'
        run: |
          echo "::warning::EIA_API_KEY appears invalid (fetch-eia-data.mjs failed) — event actuals not refreshed. Rotate the secret."
          exit 1

      - name: Check manual-cadence event dates for staleness
        id: staleness_check
        run: |
          # Unlike rule_based events (rolled forward automatically by
          # refresh-event-calendar.mjs above), manual-cadence events'
          # next_release_utc is hand-seeded and can silently drift — this is
          # the trigger source for Pro Research auto-generation (see
          # scripts/monitor-macro-economy.js), so a stale date here means a
          # real FOMC/RBI-MPC/OPEC+ meeting could pass with nothing detecting
          # it. Alert-only (not blocking) — 6 weeks matches the threshold
          # event-map.json's own _note field already recommends.
          STALE=$(node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("data/event-map.json", "utf8"));
            const sixWeeksAgo = Date.now() - 6 * 7 * 24 * 3600 * 1000;
            const stale = data.events.filter(e =>
              e.cadence_type === "manual" &&
              e.impact_tier === "high" &&
              new Date(e.next_release_utc).getTime() < sixWeeksAgo
            );
            console.log(stale.map(e => `${e.id} (next_release_utc: ${e.next_release_utc})`).join("|"));
          ')
          if [ -n "$STALE" ]; then
            echo "stale_events=$STALE" >> $GITHUB_OUTPUT
            echo "::warning::Stale manual-cadence event date(s): $STALE"
          fi

      - name: Alert — stale event date(s)
        if: steps.staleness_check.outputs.stale_events != ''
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          STALE="${{ steps.staleness_check.outputs.stale_events }}"
          ITEMS=$(echo "$STALE" | tr '|' '\n' | sed 's/^/<li>/;s/$/<\/li>/' | tr -d '\n')
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${BREVO_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"sender\": { \"name\": \"BhaavBrief Watchdog\", \"email\": \"${SENDER_EMAIL}\" },
              \"to\": [{ \"email\": \"00tradingview00@gmail.com\" }],
              \"subject\": \"⚠️ Stale event date(s) in event-map.json\",
              \"htmlContent\": \"<p>These manual-cadence, high-impact events have a next_release_utc more than 6 weeks in the past — nobody has updated them against the source calendar:</p><ul>${ITEMS}</ul><p>These dates drive Pro Research auto-generation (scripts/monitor-macro-economy.js) — a stale date means a real event could pass with nothing detecting it. Update data/event-map.json.</p>\"
            }" || true

      # Only the EIA fetch and stale-event cases alerted before; a failure
      # anywhere else (calendar refresh, impact computation, push) was silent.
      - name: Alert on failure
        if: failure()
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"sender":{"name":"BhaavBrief Bot","email":"${{ secrets.SENDER_EMAIL }}"},"to":[{"email":"00tradingview00@gmail.com"}],"subject":"ACTION REQUIRED: Event calendar refresh failed — '"$(TZ=Asia/Kolkata date +'%d %b %Y')"'","htmlContent":"<p><strong>Refresh Event Impact Stats</strong> failed on <strong>'"$(TZ=Asia/Kolkata date +'%d %b %Y, %I:%M %p IST')"'</strong>. The event calendar (/calendar, alerts, next-event cards) depends on it.</p><p><a href=\"https://github.com/${{ github.repository }}/actions/workflows/refresh-event-impact.yml\">Re-run workflow →</a></p>"}'
